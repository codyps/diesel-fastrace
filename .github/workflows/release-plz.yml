name: Release-plz

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.repository == 'codyps/diesel-fastrace' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        timeout-minutes: 5
        run: rustup update stable

      - name: Publish unpublished packages
        # Includes nested tool downloads and their built-in retries.
        timeout-minutes: 15
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

  release-pr:
    name: Prepare release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.repository == 'codyps/diesel-fastrace' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        timeout-minutes: 5
        run: rustup update stable

      - name: Create or update the release PR
        # Includes nested tool downloads and their built-in retries.
        timeout-minutes: 15
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Dispatch CI for release PRs created with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName,author --jq '.[] | select(.author.login == "app/github-actions") | .headRefName | select(startswith("release-plz-"))' |
          while IFS= read -r branch; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          done
