name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        timeout-minutes: 5
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Test automatic release policy
        timeout-minutes: 1
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check shared integration suite formatting
        run: rustfmt --edition 2024 --check tests/common/suite.rs

      - name: Run Clippy with all features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps

      - name: Verify package contents
        run: cargo package

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup update stable
      - run: cargo test --locked --all-features

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: diesel_fastrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diesel_fastrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIESEL_FASTRACE_TEST_DATABASE_URL: postgres://postgres:integration-test@localhost:5432/diesel_fastrace_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Install PostgreSQL client development library
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Check integration test formatting
        run: cargo fmt --manifest-path tests/postgres/Cargo.toml -- --check
      - name: Lint integration tests
        run: cargo clippy --locked --manifest-path tests/postgres/Cargo.toml --all-targets -- -D warnings
      - name: Run real Diesel PostgreSQL integration tests
        run: cargo test --locked --manifest-path tests/postgres/Cargo.toml

  sqlite:
    name: SQLite integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: cargo clippy --locked --manifest-path tests/sqlite/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tests/sqlite/Cargo.toml

  mysql:
    name: MySQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test
          MYSQL_DATABASE: diesel_fastrace_test
          MYSQL_USER: tester
          MYSQL_PASSWORD: integration-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DIESEL_FASTRACE_TEST_MYSQL_URL: mysql://tester:integration-test@127.0.0.1:3306/diesel_fastrace_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev
      - run: cargo clippy --locked --manifest-path tests/mysql/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tests/mysql/Cargo.toml

  mixed:
    name: Mixed backend integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: diesel_fastrace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d diesel_fastrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test
          MYSQL_DATABASE: diesel_fastrace_test
          MYSQL_USER: tester
          MYSQL_PASSWORD: integration-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DIESEL_FASTRACE_TEST_DATABASE_URL: postgres://postgres:integration-test@localhost:5432/diesel_fastrace_test
      DIESEL_FASTRACE_TEST_MYSQL_URL: mysql://tester:integration-test@127.0.0.1:3306/diesel_fastrace_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev libpq-dev libsqlite3-dev
      - run: cargo clippy --locked --manifest-path tests/mixed/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tests/mixed/Cargo.toml
